<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Palabra por palabra</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="neo.css">
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</helmet>
<div class="screen">
  <div class="top">
    <button class="ibtn" aria-label="Abrir Mis transcripciones"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
    <div style="flex:1;min-width:0">
      <div class="title ell">Noches de Verano</div>
      <div class="sub ell">Línea 4 · palabra 2 de 5</div>
    </div>
    <div class="saved"><i></i>Guardado</div>
  </div>

  <div class="seg" role="tablist">
    <button>Línea</button>
    <button class="on">Palabra</button>
    <button>Ráfaga</button>
  </div>

  <div class="well" style="padding:10px 12px 8px;display:flex;flex-direction:column;gap:6px">
    <div class="wv" style="height:44px">
      <svg viewBox="0 0 304 100" preserveAspectRatio="none" aria-hidden="true"><path class="base" stroke-width="3.5" stroke-linecap="round" fill="none" d="M5 42V58M11 36V64M17 28V72M23 20V80M29 32V68M35 24V76M41 12V88M47 6V94M53 20V80M59 30V70M65 16V84M71 4V96M77 10V90M83 22V78M89 34V66M95 26V74M101 14V86M107 2V98M113 8V92M119 20V80M125 28V72M131 32V68M137 22V78M143 10V90M149 4V96M155 16V84M161 26V74M167 36V64M173 30V70M179 18V82M185 8V92M191 12V88M197 24V76M203 32V68M209 20V80M215 6V94M221 14V86M227 28V72M233 38V62M239 32V68M245 22V78M251 16V84M257 24V76M263 34V66M269 40V60M275 36V64M281 30V70M287 38V62M293 42V58M299 44V56"/></svg>
      <div class="pl"><svg viewBox="0 0 304 100" preserveAspectRatio="none" aria-hidden="true"><path stroke-width="3.5" stroke-linecap="round" fill="none" d="M5 42V58M11 36V64M17 28V72M23 20V80M29 32V68M35 24V76M41 12V88M47 6V94M53 20V80M59 30V70M65 16V84M71 4V96M77 10V90M83 22V78M89 34V66M95 26V74M101 14V86M107 2V98M113 8V92M119 20V80M125 28V72M131 32V68M137 22V78M143 10V90M149 4V96M155 16V84M161 26V74M167 36V64M173 30V70M179 18V82M185 8V92M191 12V88M197 24V76M203 32V68M209 20V80M215 6V94M221 14V86M227 28V72M233 38V62M239 32V68M245 22V78M251 16V84M257 24V76M263 34V66M269 40V60M275 36V64M281 30V70M287 38V62M293 42V58M299 44V56"/></svg></div>
      <div class="head" style="left:42%"></div>
    </div>
    <div class="tl mono"><span>01:12.340</span><span>Pre-Roll activo · 2.5 s</span></div>
  </div>

  <div class="well" style="flex:1;min-height:0;padding:16px;display:flex;flex-direction:column;gap:12px;overflow:hidden">
    <div style="font-size:16px;line-height:1.45;font-weight:600;color:var(--mute)">
      <span style="color:var(--ok);font-weight:800">corazón</span> <span style="background:var(--bg);box-shadow:3px 3px 7px var(--lo),-3px -3px 7px var(--hi);padding:2px 8px;border-radius:9px;color:var(--ink);font-weight:800">de</span> sal y fuego
    </div>

    <div style="text-align:center;margin-top:2px">
      <div class="sub" style="letter-spacing:.12em;font-weight:800;font-size:12px">PALABRA OBJETIVO</div>
      <div style="font-size:72px;font-weight:800;line-height:1.05;color:var(--acc);margin-top:6px">de</div>
    </div>

    <div style="display:flex;justify-content:space-between;gap:8px">
      <div class="pill mute">← corazón</div>
      <div class="pill mute">sal →</div>
    </div>

    <div style="margin-top:auto;display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;box-shadow:3px 3px 7px var(--lo),-3px -3px 7px var(--hi)">
      <div class="lamps" aria-hidden="true"><span class="lamp r"></span><span class="lamp a on"></span><span class="lamp g"></span></div>
      <div style="flex:1">
        <div style="font-weight:800;font-size:14px">PREPÁRATE</div>
        <div class="sub">cuenta regresiva del Pre-Roll</div>
      </div>
      <div class="mono" style="font-size:22px;font-weight:700">−1.4s</div>
    </div>
  </div>

  <button class="btn" style="color:var(--acc)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/></svg>Repetir Pre-Roll −2.5 s</button>

  <button class="sync" style="height:96px"><span class="big">MARCAR PALABRA</span><span class="hint">Toca al sonar «de» · mantén para sílabas</span></button>

  <nav class="nav" aria-label="Principal">
    <button><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14M10 5v14M15 7l4 12"/></svg>Catálogo</button>
    <button><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 11h14M5 16h9"/></svg>Letra</button>
    <button class="on"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v14M8 7v6M16 6v8M4 10v2M20 9v4"/></svg>Sincronizar</button>
    <button><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4M5 14v6h14v-6"/></svg>Exportar</button>
  </nav>
</div>
</x-dc>

  renderVals() { return {}; }

</script>
</body>
</html>
