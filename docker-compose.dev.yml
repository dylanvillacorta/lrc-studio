services:
  lrc-studio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:8080}
        APP_VERSION: ${APP_VERSION:-0.0.0-dev}
        APP_COMMIT: ${APP_COMMIT:-local}
    image: lrc-studio:local
    restart: unless-stopped
    ports:
      - "${DEV_BIND_IP:-0.0.0.0}:${DEV_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=4m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
